  <text x='400' y='716' font-family='system-ui, -apple-system, sans-serif' font-weight='800' font-size='28' fill='#fef08a' text-anchor='middle' letter-spacing='6'>AUCTION NIGHT</text>
  <text x='400' y='748' font-family='system-ui, -apple-system, sans-serif' font-weight='600' font-size='14' fill='#38bdf8' text-anchor='middle' letter-spacing='4'>BRITISH REVERSE RFQ</text>
