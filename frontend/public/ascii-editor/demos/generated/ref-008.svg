  <!-- Gavel Head (Angled Luxury Auction Hammer) -->
  <g transform='translate(400, 340) rotate(-32) translate(-400, -340)'>
    <!-- Hammer Handle -->
    <rect x='388' y='310' width='24' height='270' rx='12' fill='url(#cyanGrad)' stroke='#ffffff' stroke-width='2' opacity='0.95'/>
    <rect x='382' y='550' width='36' height='40' rx='8' fill='url(#goldGrad)'/>

    <!-- Hammer Head Core -->
    <rect x='300' y='240' width='200' height='76' rx='14' fill='url(#goldGrad)' stroke='#ffffff' stroke-width='3'/>
    <!-- Left Face Ring -->
    <rect x='286' y='232' width='24' height='92' rx='6' fill='#ffffff' opacity='0.95'/>
    <!-- Right Face Ring -->
    <rect x='490' y='232' width='24' height='92' rx='6' fill='#ffffff' opacity='0.95'/>

