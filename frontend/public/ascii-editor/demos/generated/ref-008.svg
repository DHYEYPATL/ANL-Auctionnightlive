<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800' viewBox='0 0 800 800'>
  <defs>
    <radialGradient id='bgGrad' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='50%' stop-color='#080e1a'/>
      <stop offset='100%' stop-color='#02050a'/>
    </radialGradient>
    <radialGradient id='coreGlow' cx='50%' cy='42%' r='45%'>
      <stop offset='0%' stop-color='#38bdf8' stop-opacity='0.95'/>
      <stop offset='30%' stop-color='#2563eb' stop-opacity='0.65'/>
      <stop offset='70%' stop-color='#1d4ed8' stop-opacity='0.25'/>
      <stop offset='100%' stop-color='#000000' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='20%' stop-color='#fef08a'/>
      <stop offset='60%' stop-color='#eab308'/>
      <stop offset='100%' stop-color='#ca8a04'/>
    </linearGradient>
    <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='40%' stop-color='#38bdf8'/>
      <stop offset='100%' stop-color='#0284c7'/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width='800' height='800' fill='url(#bgGrad)'/>
  <circle cx='400' cy='360' r='300' fill='url(#coreGlow)'/>

  <!-- Concentric Auction Orbit Rings -->
  <circle cx='400' cy='360' r='270' fill='none' stroke='#38bdf8' stroke-width='2' stroke-dasharray='10 16' opacity='0.5'/>
  <circle cx='400' cy='360' r='210' fill='none' stroke='#60a5fa' stroke-width='3' opacity='0.6'/>
  <circle cx='400' cy='360' r='150' fill='none' stroke='#eab308' stroke-width='2' opacity='0.7'/>

  <!-- Dial Ticks -->
